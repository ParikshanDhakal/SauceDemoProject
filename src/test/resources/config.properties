# Configuration for SauceDemo Test Project
# Any value here can be overridden from the command line, e.g. mvn test -Dbrowser=firefox -Dheadless=true

url=https://www.saucedemo.com/

# chrome, firefox or edge
browser=chrome

# true = run without opening a browser window (used in GitHub Actions)
headless=false

# Seconds to wait for elements before a test fails
timeout=10

# Public demo credentials published on the SauceDemo login page
username=standard_user
password=secret_sauce
