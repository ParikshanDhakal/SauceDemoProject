name: UI Tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:

  regression:
    name: Regression suite (Chrome, headless)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run regression tests
        run: mvn -B test -Dheadless=true

      - name: Publish results
        if: always()
        run: |
          RESULT=$(grep -h "Tests run:" target/surefire-reports/*.txt | head -n 1 | sed 's/, Time elapsed.*//')
          echo "### Regression suite" >> "$GITHUB_STEP_SUMMARY"
          echo "${RESULT:-No results found}" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Regression suite results::${RESULT:-No results found}"

      - name: Upload HTML report and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-report
          path: reports/
          if-no-files-found: ignore

  known-bugs:
    name: Known bugs in problem_user (expected to fail)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # These tests check correct behavior against a deliberately buggy account,
      # so failures are the expected result and do not fail the build
      - name: Run known-bug tests
        run: mvn -B test -Dheadless=true -Dsuite=testng-known-bugs.xml -Dmaven.test.failure.ignore=true

      - name: Publish results
        if: always()
        run: |
          RESULT=$(grep -h "Tests run:" target/surefire-reports/*.txt | head -n 1 | sed 's/, Time elapsed.*//')
          FAILED=$(grep -h "^tests\..*<<< FAILURE" target/surefire-reports/*.txt | sed -E 's/^[a-zA-Z.]*\.([A-Za-z]+) .*/\1/' | paste -sd ',' - | sed 's/,/, /g')
          echo "### Known bugs (each failure confirms a bug in BUGS.md)" >> "$GITHUB_STEP_SUMMARY"
          echo "${RESULT:-No results found}" >> "$GITHUB_STEP_SUMMARY"
          echo "Bugs confirmed: ${FAILED:-none}" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Known bugs confirmed (expected failures)::${RESULT:-No results found}. Confirmed: ${FAILED:-none}"

      - name: Upload HTML report and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: known-bugs-report
          path: reports/
          if-no-files-found: ignore
